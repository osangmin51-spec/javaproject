name: Java CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile
        run: javac -encoding UTF-8 -d out $(find src/main/java -name "*.java" -print)

      - name: Count Java types
        shell: bash
        run: |
          count=$(grep -hE '^(public class|abstract class|class|interface) ' $(find src/main/java -name "*.java" -print) | wc -l)
          echo "Java type count: $count"
          test "$count" -ge 100
